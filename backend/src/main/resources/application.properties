spring.application.name=meal-planner

# Duomenų bazė (NFR-03). Konfigūracija perduodama aplinkos kintamaisiais (NFR-38, NFR-46)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mealplanner}
spring.datasource.username=${DB_USER:mealplanner}
spring.datasource.password=${DB_PASSWORD:mealplanner}

# Schema kuriama tik Flyway migracijomis (NFR-04), Hibernate ją tik patikrina
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true

# Sesijos slapukas (NFR-14). Lokaliai per HTTP COOKIE_SECURE=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m

# Sveikatos patikra (NFR-27)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Kainos (Eur)
app.prices.subscription=14.99
app.prices.review=19.99
app.subscription.trial-days=7
app.subscription.paid-days=30
# Dienos generavimų limitas, kol administratorius DI parametrų nenustatė (FR-08, FR-41)
app.plans.daily-generation-limit=10

# DI adapteris (DIA). Gemini klientas kuriamas GeminiConfig klasėje, todėl Spring AI autokonfigūracija
# išjungta: be API rakto ji neleistų paleisti programos (NFR-29), o jos pakartojimai trukdytų FR-14 logikai.
spring.autoconfigure.exclude=\
  org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration,\
  org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration,\
  org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration,\
  org.springframework.ai.model.google.genai.autoconfigure.image.GoogleGenAiImageConnectionAutoConfiguration,\
  org.springframework.ai.model.google.genai.autoconfigure.image.GoogleGenAiImageAutoConfiguration

# DI parametrai: modelį ir limitą nustato administratorius (NI-20); šios reikšmės – numatytosios
app.ai.api-key=${GEMINI_API_KEY:}
app.ai.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
# Gemini 3 modeliams: MINIMAL, LOW, MEDIUM, HIGH. Gemini 2 modeliams mąstymas išjungiamas (thinkingBudget=0)
app.ai.thinking-level=${GEMINI_THINKING_LEVEL:MINIMAL}
# Vieno DI kvietimo laiko riba ir viso generavimo riba (NFR-28, NFR-31)
app.ai.call-timeout=25s
app.ai.generation-timeout=60s
app.ai.max-attempts=3
# Užklausos šablonas ir atsakymo JSON schema – atskiri failai (NFR-45)
app.ai.system-prompt=classpath:prompts/meal-system-prompt.txt
app.ai.response-schema=classpath:prompts/meal-response-schema.json
# Dienos generavimų limitas skaičiuojamas nuo vidurnakčio Lietuvos laiku (FR-15)
app.time-zone=Europe/Vilnius
