# Žiniatinklio serveris: tiekia kliento sąsajos failus, o /api/ užklausas perduoda
# programų serveriui (NFR-12). Sąsaja ir API veikia viename domene, todėl CORS nekonfigūruojamas.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PWA paslaugų darbuotojas ir manifestas neturi būti talpinami ilgam
    location ~* ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Vieno puslapio programa: visi kiti keliai grąžina index.html
    location / {
        try_files $uri /index.html;
    }
}
